# Release pipeline for the Rainbird VS Code extension.
#
# - Every push and merge request: install, compile and run the unit tests
#   (`test`) and the integration tests in a real VS Code (`integration`).
#   The package job on a tag waits for both.
# - Every tag `vX.Y.Z`: check the tag matches package.json, package the VSIX,
#   store it in the project's generic package registry, and create a GitLab
#   Release whose notes are the matching section of CHANGELOG.md.
# - Optional, manual: publish the same VSIX to the VS Code Marketplace. No
#   token: the job signs in to Microsoft Entra ID with GitLab's OIDC token
#   (workload identity federation). Needs CI variables `AZURE_CLIENT_ID` and
#   `AZURE_TENANT_ID` for an Entra app registration whose federated credential
#   trusts this project's `v*` tags, and that app must be a Contributor on the
#   `RainbirdTechnologies` publisher. `marketplace-identity` prints the ID to
#   add as the publisher member (run it once).
# - Optional, manual: publish the same VSIX to Open VSX. Needs a masked CI
#   variable `OVSX_PAT` holding an open-vsx.org access token with publish
#   rights on the `RainbirdTechnologies` namespace.
# - Automatic, after each publish job: `verify-marketplace` and
#   `verify-openvsx` wait until the store serves the new version under the
#   manifest's display name (scripts/verify-published.mjs), and fail if not.
#
# Release flow: bump `version` in package.json, add a dated CHANGELOG entry,
# commit, `git tag vX.Y.Z`, `git push origin main vX.Y.Z`.

# One pipeline per push. Without this, a push to a branch with an open merge
# request starts two (a branch pipeline and a merge request pipeline), because
# the jobs' rules accept both. Branches with an open MR get only the MR
# pipeline; main, other branches and release tags keep their own pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - package
  - release

default:
  # Pin to GitLab.com's hosted Docker runners. Without a tag, a self-hosted
  # shell runner in the group can pick the job up, ignore `image` and fail
  # with "npm: command not found".
  tags: [saas-linux-small-amd64]
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  VSIX_NAME: rainbird
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${VSIX_NAME}"

.release-tag: &release-tag
  if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

test:
  stage: test
  script:
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - *release-tag

# The extension in a real VS Code (src/integration/): it activates, its files
# open as Raelog with diagnostics, symbols, completions, hovers and formatting,
# every contributed command is registered, and settings saved under the old
# "rblang" id are migrated. Linux needs a virtual display; Debian bookworm is
# pinned because newer releases renamed libasound2. VS Code is cached.
integration:
  stage: test
  image: node:22-bookworm
  timeout: 20m
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
    - key: vscode-test
      paths: [.vscode-test/]
  script:
    - apt-get update -qq
    - apt-get install -y -qq xvfb xauth libasound2 libgbm1 libgtk-3-0 libnss3 libxss1 libsecret-1-0 > /dev/null
    - xvfb-run -a npm run test:integration
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - *release-tag

package:
  stage: package
  rules:
    - *release-tag
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "v$VERSION" != "$CI_COMMIT_TAG" ]; then
        echo "Tag $CI_COMMIT_TAG does not match package.json version $VERSION" >&2
        exit 1
      fi
    - |
      if ! grep -q "^## $VERSION " CHANGELOG.md; then
        echo "CHANGELOG.md has no '## $VERSION' section" >&2
        exit 1
      fi
    # Release notes: the CHANGELOG section for this version, without its heading.
    - awk -v v="$VERSION" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md > release-notes.md
    # Relative links in README and CHANGELOG are rewritten by vsce to the
    # `repository` URL in package.json, the public GitHub mirror.
    - npx --yes @vscode/vsce@3 package --out "${VSIX_NAME}-${VERSION}.vsix"
    - >
      curl --fail --silent --show-error
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "${VSIX_NAME}-${VERSION}.vsix"
      "${PACKAGE_REGISTRY_URL}/${VERSION}/${VSIX_NAME}-${VERSION}.vsix"
    - echo "VERSION=$VERSION" > release.env
  artifacts:
    paths:
      - "${VSIX_NAME}-*.vsix"
      - release-notes.md
    reports:
      dotenv: release.env
    expire_in: 1 year

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  before_script: []
  needs:
    - job: package
      artifacts: true
  rules:
    - *release-tag
  script:
    - echo "Creating release $CI_COMMIT_TAG for version $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Rae by Rainbird $CI_COMMIT_TAG"
    description: release-notes.md
    assets:
      links:
        - name: "${VSIX_NAME}-${VERSION}.vsix"
          url: "${PACKAGE_REGISTRY_URL}/${VERSION}/${VSIX_NAME}-${VERSION}.vsix"
          link_type: package

# Signs in to Entra ID as the publishing app with GitLab's OIDC token.
.azure-login:
  id_tokens:
    AZURE_JWT:
      aud: api://AzureADTokenExchange
  before_script:
    - |
      if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
        echo "Set CI variables AZURE_CLIENT_ID and AZURE_TENANT_ID to publish" >&2
        exit 1
      fi
    - curl -sL https://aka.ms/InstallAzureCLIDeb | bash > /dev/null
    - >
      az login --service-principal
      --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID"
      --federated-token "$AZURE_JWT" --allow-no-subscriptions > /dev/null

# Prints the `id` to add as a member of the Marketplace publisher.
marketplace-identity:
  extends: .azure-login
  stage: release
  cache: []
  needs: []
  rules:
    - <<: *release-tag
      when: manual
      allow_failure: true
  script:
    - >
      az rest --uri https://app.vssps.visualstudio.com/_apis/profile/profiles/me
      --resource 499b84ac-1321-427f-aa17-267ca6975798

publish-marketplace:
  extends: .azure-login
  stage: release
  cache: []
  needs:
    - job: package
      artifacts: true
  rules:
    - <<: *release-tag
      when: manual
      allow_failure: true
  script:
    - npx --yes @vscode/vsce@3 publish --packagePath "${VSIX_NAME}-${VERSION}.vsix" --azure-credential

publish-openvsx:
  stage: release
  needs:
    - job: package
      artifacts: true
  rules:
    - <<: *release-tag
      when: manual
      allow_failure: true
  script:
    - |
      if [ -z "$OVSX_PAT" ]; then
        echo "Set a masked CI variable OVSX_PAT with an Open VSX token to publish" >&2
        exit 1
      fi
    - npx --yes ovsx@0 publish --packagePath "${VSIX_NAME}-${VERSION}.vsix" --pat "$OVSX_PAT"

# After a publish job, waits until the store serves this version under the
# manifest's display name, and fails if it does not within the time limit.
# These jobs start by themselves once their publish job has run (and wait
# while it has not). The publish jobs are allowed to fail, which shows only as
# a warning; a failed or stuck publish fails these jobs, and the pipeline.
.verify-published:
  stage: release
  cache: []
  before_script: []
  timeout: 30m
  rules:
    - *release-tag

verify-marketplace:
  extends: .verify-published
  needs: [publish-marketplace]
  script:
    # The Marketplace scans each upload before serving it, which can take a while.
    - node scripts/verify-published.mjs marketplace --minutes 20

verify-openvsx:
  extends: .verify-published
  needs: [publish-openvsx]
  script:
    - node scripts/verify-published.mjs openvsx --minutes 10
